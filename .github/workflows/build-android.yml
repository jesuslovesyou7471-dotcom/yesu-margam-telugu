name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android app version (example: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PWA_MANIFEST: https://yesu-margam-telugu.hatchable.site/manifest-v14.json
  APP_DIR: android

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required."
            exit 1
          fi
          mkdir -p "$APP_DIR"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APP_DIR/android.keystore"
          chmod 600 "$APP_DIR/android.keystore"

      - name: Initialize TWA project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Android signing secrets are missing."
            exit 1
          fi

          mkdir -p "$APP_DIR"

          cat > /tmp/init.expect <<'EXPECT'
          set timeout 1800
          spawn bubblewrap init --manifest "$env(PWA_MANIFEST)" --directory "$env(APP_DIR)"
          expect {
            -re ".*Application ID.*" { send "com.jesuscentered.yesumargam\r"; exp_continue }
            -re ".*Package ID.*" { send "com.jesuscentered.yesumargam\r"; exp_continue }
            -re ".*Key store.*path.*" { send "$env(APP_DIR)/android.keystore\r"; exp_continue }
            -re ".*keystore.*path.*" { send "$env(APP_DIR)/android.keystore\r"; exp_continue }
            -re ".*alias.*" { send "$env(KEY_ALIAS)\r"; exp_continue }
            -re ".*Key.*Store.*Password.*" { send "$env(KEYSTORE_PASSWORD)\r"; exp_continue }
            -re ".*Key.*Password.*" { send "$env(KEY_PASSWORD)\r"; exp_continue }
            -re ".*password.*" { send "$env(KEYSTORE_PASSWORD)\r"; exp_continue }
            eof
          }
          EXPECT

          sudo apt-get update -y
          sudo apt-get install -y expect
          env PWA_MANIFEST="$PWA_MANIFEST" APP_DIR="$APP_DIR" KEY_ALIAS="$KEY_ALIAS" KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" KEY_PASSWORD="$KEY_PASSWORD" expect /tmp/init.expect

      - name: Set version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python - <<'PY'
          import json, os
          p="android/twa-manifest.json"
          with open(p) as f: d=json.load(f)
          v=os.environ["VERSION"]
          d["appVersion"]=v
          d["appVersionName"]=v
          d["appVersionCode"]=int(os.environ.get("GITHUB_RUN_NUMBER","1"))
          with open(p,"w") as f: json.dump(d,f,indent=2)
          PY

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd "$APP_DIR"
          bubblewrap build --manifest=twa-manifest.json --signingKeyPath="$PWD/android.keystore" --signingKeyAlias="$KEY_ALIAS"

      - name: Collect APK
        run: |
          mkdir -p dist
          find android -type f \( -name "*signed.apk" -o -name "*.aab" -o -name "assetlinks.json" \) -print
          cp android/app-release-signed.apk dist/jesus-centered-yesu-margam.apk
          if [ -f android/app-release-bundle.aab ]; then cp android/app-release-bundle.aab dist/jesus-centered-yesu-margam.aab; fi
          if [ -f android/assetlinks.json ]; then cp android/assetlinks.json dist/assetlinks.json; fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jesus-centered-android
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
            git tag "$TAG"
            git push origin "$TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" dist/jesus-centered-yesu-margam.apk dist/jesus-centered-yesu-margam.aab --title "JESUS CENTERED $TAG" --generate-notes
